services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: fidelitypay-app
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - .env
    ports:
      - "8060:8060"
    restart: unless-stopped

  db:
    image: mysql:8.4
    container_name: fidelitypay-db
    environment:
      MYSQL_DATABASE: fidelityapi
      MYSQL_USER: fidelitypay
      MYSQL_PASSWORD: fidelitypay
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3308:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: [ "CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-proot" ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    restart: unless-stopped

volumes:
  mysql-data:
