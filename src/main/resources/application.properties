spring.application.name=Fidelitypay
# DB Config
spring.datasource.url=jdbc:mysql://localhost:3306/apii?useSSL=false&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.defer-datasource-initialization=true

# Actuator pour monitoring
management.endpoints.web.exposure.include=health,info

# API Keys externes (ex: pour SamirPay, PayDunya)
# samirpay.api.key=your_key
# paydunya.api.key=your_key

# PayDunya Configuration
