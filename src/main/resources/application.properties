spring.application.name=Fidelitypay
spring.config.import=optional:file:.env[.properties]
# DB Config
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3308/fidelityapi?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:fidelitypay}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:fidelitypay}
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
spring.jpa.show-sql=${SPRING_JPA_SHOW_SQL:true}
spring.jpa.defer-datasource-initialization=true
# Force l'exécution de data.sql à chaque démarrage
spring.sql.init.mode=always
# Attend que Hibernate ait fini de créer les tables avant d'insérer les donnée
# Actuator pour monitoring
management.endpoints.web.exposure.include=health,info
server.port=${SERVER_PORT:8060}

# PayDunya Configuration
# IMPORTANT: Use Sandbox keys with 'sandbox-api/v1' URL, or Prod keys with 'api/v1' URL.
# If running in IDE (Local), replace the placeholders below or set the ENV vars.
# If running in Docker, see docker-compose.yml.
paydunya.api.base-url=${PAYDUNYA_API_BASE_URL:https://app.paydunya.com/sandbox-api/api/v1}
paydunya.api.master-key=${PAYDUNYA_API_MASTER_KEY:}
paydunya.api.private-key=${PAYDUNYA_API_PRIVATE_KEY:}
paydunya.api.token=${PAYDUNYA_API_TOKEN:}
paydunya.store.name=${PAYDUNYA_STORE_NAME:FidelityPay Store}
paydunya.callback-url=${PAYDUNYA_CALLBACK_URL:http://localhost:8060/api/v1/providers/paydunya/checkout/ipn}


# KkiaPay Configuration
kkiapay.api.base-url=${KKIAPAY_API_BASE_URL:https://api-sandbox.kkiapay.me}
kkiapay.api.public-key=${KKIAPAY_API_PUBLIC_KEY:}
kkiapay.api.private-key=${KKIAPAY_API_PRIVATE_KEY:}
kkiapay.api.secret-key=${KKIAPAY_API_SECRET_KEY:}
kkiapay.store.name=${KKIAPAY_STORE_NAME:FidelityPay Store}
kkiapay.callback-url=${KKIAPAY_CALLBACK_URL:http://localhost:8060/api/v1/providers/kkiapay/checkout/ipn}

# HTTP client timeouts (ms)
http.connect.timeout=${HTTP_CONNECT_TIMEOUT:5000}
http.read.timeout=${HTTP_READ_TIMEOUT:10000}

# JWT Configuration
jwt.secret=${JWT_SECRET:change-me-in-production-please-use-a-long-secret-key}
jwt.expiration=${JWT_EXPIRATION:86400000}

# Development-only admin creation secret. Change in production or set via env var.
admin.creation.secret=${ADMIN_CREATION_SECRET:dev-admin-secret-2026}

# Temporary development bridge: when true, pay-in routing may use provider keys from application properties if a merchant has not configured credentials yet. Keep false outside local/dev.
#payment.providers.allow-global-credentials-fallback=${PAYMENT_PROVIDERS_ALLOW_GLOBAL_CREDENTIALS_FALLBACK:false}
payment.providers.allow-global-credentials-fallback=true

payment.routing.min-sample-size=10
payment.routing.max-acceptable-failure-rate=0.05
