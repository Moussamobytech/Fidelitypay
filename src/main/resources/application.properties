spring.application.name=Fidelitypay
# DB Config
spring.datasource.url=jdbc:mysql://localhost:3306/fidelityapi?useSSL=false&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.defer-datasource-initialization=true
# Force l'exécution de data.sql à chaque démarrage
spring.sql.init.mode=always
# Attend que Hibernate ait fini de créer les tables avant d'insérer les donnée
# Actuator pour monitoring
management.endpoints.web.exposure.include=health,info

